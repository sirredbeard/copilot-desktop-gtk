# Build and push the copilot-desktop-gtk-builder image to GHCR, for both
# arches. Each arch builds on a runner of that arch (no QEMU: the seed
# step runs Flatpak inside the image, and Native AOT linking wants a
# native toolchain). The per-arch images push as latest-<arch> and
# YYYY.MM.DD-<arch>; a manifest job then joins them into the plain
# latest and YYYY.MM.DD tags, so consumers keep pulling one name and
# get their arch. Local testing uses podman (scripts/build-builder-image.sh).
#
# Image tags: latest + YYYY.MM.DD (UTC build date), each a multi-arch
# manifest over x86_64 and aarch64. No sha/dotnet/commit tags.
name: builder-image

on:
  push:
    branches: [main]
    paths:
      - "container/**"
      - "scripts/resolve-dotnet-sdk.sh"
      - "scripts/resolve-arch.sh"
      - "scripts/build-builder-image.sh"
      - "scripts/seed-flatpak-runtimes.sh"
      - ".github/workflows/builder-image.yml"
  pull_request:
    paths:
      - "container/**"
      - "scripts/resolve-dotnet-sdk.sh"
      - "scripts/resolve-arch.sh"
      - "scripts/build-builder-image.sh"
      - "scripts/seed-flatpak-runtimes.sh"
      - ".github/workflows/builder-image.yml"
  workflow_dispatch:
  schedule:
    # Pick up new .NET 11 SDKs and Flatpak runtimes weekly.
    - cron: "17 6 * * 1"

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: copilot-desktop-gtk-builder
  REGISTRY: ghcr.io

jobs:
  # One date tag for the whole run, computed once so the two arch legs
  # and the manifest job agree even if a leg straddles midnight UTC.
  meta:
    runs-on: ubuntu-latest
    outputs:
      date_tag: ${{ steps.ver.outputs.date_tag }}
      image: ${{ steps.ver.outputs.image }}
    steps:
      - name: Image version (YYYY.MM.DD UTC)
        id: ver
        run: |
          set -euo pipefail
          DATE_TAG="$(date -u +%Y.%m.%d)"
          IMAGE="${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}"
          {
            echo "date_tag=${DATE_TAG}"
            echo "image=${IMAGE}"
          } >> "$GITHUB_OUTPUT"
          echo "builder image: ${IMAGE} (${DATE_TAG})"

  build-and-push:
    needs: meta
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
            platform: linux/amd64
          - arch: aarch64
            runner: ubuntu-24.04-arm
            platform: linux/arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve .NET 11 SDK
        id: dotnet
        run: |
          set -euo pipefail
          ./scripts/resolve-dotnet-sdk.sh "$GITHUB_OUTPUT"
          cat "$GITHUB_OUTPUT"

      - name: Per-arch image tags
        id: ver
        env:
          IMAGE: ${{ needs.meta.outputs.image }}
          DATE_TAG: ${{ needs.meta.outputs.date_tag }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          {
            echo "tag_latest=${IMAGE}:latest-${ARCH}"
            echo "tag_date=${IMAGE}:${DATE_TAG}-${ARCH}"
          } >> "$GITHUB_OUTPUT"
          echo "builder tags (this arch): latest-${ARCH} ${DATE_TAG}-${ARCH}"

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc || true
          df -h

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Dockerfile installs tooling + flathub remote only. GNOME 50 runtimes are
      # seeded in a privileged container after build (build-push-action has no
      # privileged input; actionlint rejects inventing one).
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: container/Dockerfile
          platforms: ${{ matrix.platform }}
          load: true
          tags: localhost/copilot-desktop-gtk-builder:seed
          labels: |
            org.opencontainers.image.title=copilot-desktop-gtk-builder
            org.opencontainers.image.description=Azure Linux 4 + .NET 11 + Flatpak builder
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.meta.outputs.date_tag }}
            org.opencontainers.image.revision=${{ github.sha }}
          build-args: |
            DOTNET_SDK_VERSION=${{ steps.dotnet.outputs.DOTNET_SDK_VERSION }}
          cache-from: type=gha,scope=builder-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=builder-${{ matrix.arch }}

      - name: Seed Flatpak GNOME 50 runtimes
        run: |
          set -euo pipefail
          docker rm -f copilot-builder-seed >/dev/null 2>&1 || true
          docker create --name copilot-builder-seed --privileged \
            localhost/copilot-desktop-gtk-builder:seed sleep infinity
          docker start copilot-builder-seed
          docker cp scripts/seed-flatpak-runtimes.sh copilot-builder-seed:/tmp/seed-flatpak-runtimes.sh
          docker exec -e FLATPAK_USER_DIR=/var/lib/flatpak-builder-user \
            copilot-builder-seed bash /tmp/seed-flatpak-runtimes.sh
          docker commit copilot-builder-seed "${{ steps.ver.outputs.tag_latest }}"
          docker tag "${{ steps.ver.outputs.tag_latest }}" "${{ steps.ver.outputs.tag_date }}"
          docker rm -f copilot-builder-seed
          docker images | head -20

      - name: Push image
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          docker push "${{ steps.ver.outputs.tag_latest }}"
          docker push "${{ steps.ver.outputs.tag_date }}"

  # Join the two per-arch images under the plain tags. Runs only when
  # the arch legs pushed (never on a pull request).
  manifest:
    if: github.event_name != 'pull_request'
    needs: [meta, build-and-push]
    runs-on: ubuntu-latest
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create multi-arch manifests
        env:
          IMAGE: ${{ needs.meta.outputs.image }}
          DATE_TAG: ${{ needs.meta.outputs.date_tag }}
        run: |
          set -euo pipefail
          docker buildx imagetools create \
            -t "${IMAGE}:latest" \
            "${IMAGE}:latest-x86_64" \
            "${IMAGE}:latest-aarch64"
          docker buildx imagetools create \
            -t "${IMAGE}:${DATE_TAG}" \
            "${IMAGE}:${DATE_TAG}-x86_64" \
            "${IMAGE}:${DATE_TAG}-aarch64"
          docker buildx imagetools inspect "${IMAGE}:latest"
