# Lint, Native AOT, smoke-test, and Flatpak — product build inside the AZL4 builder image.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

env:
  VERSION: 0.1.0
  BUILDER: ghcr.io/sirredbeard/copilot-desktop-gtk-builder:latest

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck + desktop-file-utils
        run: sudo apt-get update && sudo apt-get install -y shellcheck desktop-file-utils
      - name: Install actionlint
        run: |
          set -euo pipefail
          ver="$(curl -fsSL https://api.github.com/repos/rhysd/actionlint/releases/latest | python3 -c 'import json,sys; print(json.load(sys.stdin)["tag_name"])')"
          curl -fsSL "https://github.com/rhysd/actionlint/releases/download/${ver}/actionlint_${ver#v}_linux_amd64.tar.gz" | sudo tar -xz -C /usr/local/bin actionlint
          actionlint -version
      - name: Lint
        run: ./scripts/lint-all.sh

  build:
    runs-on: ubuntu-latest
    needs: lint
    container:
      image: ghcr.io/sirredbeard/copilot-desktop-gtk-builder:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: --user root --privileged
    steps:
      - uses: actions/checkout@v4
      - name: NuGet package cache
        uses: actions/cache@v4
        with:
          path: /root/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            nuget-${{ runner.os }}-
      - name: Build AOT + icons + Flatpak
        run: |
          set -euo pipefail
          # Builder image seeds GNOME 50 + GL/codecs; build-flatpak skips re-download.
          ./scripts/build-app.sh Release
          ./scripts/build-icons.sh
          ./scripts/test-smoke.sh
          ./scripts/build-flatpak.sh "${{ env.VERSION }}"
          ls -lah dist/publish/ dist/flatpak/
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: copilot-desktop-gtk-${{ env.VERSION }}
          path: |
            dist/publish/copilot-desktop-gtk
            dist/flatpak/*.flatpak
          if-no-files-found: error
