# Manual release: auto-bump patch, build AOT + Flatpak in the builder image
# for both arches (x86_64 and aarch64, each on a runner of that arch),
# publish GitHub Release assets, deploy the ostree repos to GitHub Pages
# so flatpakref installs get updates via `flatpak update`.
#
# Pages layout: the x86_64 ostree repo stays at repo/ (the URL every
# existing install already uses). The aarch64 repo sits next to it at
# repo-aarch64/, with its own .flatpakref / .flatpakrepo files. Two
# repos, not one merged repo: each arch keeps the exact signing and
# static-delta flow build-flatpak.sh already proves per build, and no
# merge step gets to break it.
#
# One-time Pages setup (GITHUB_TOKEN often cannot create the site):
#   Settings → Pages → Source: GitHub Actions
#   or: gh api -X POST repos/OWNER/REPO/pages -f build_type=workflow \
#         -f source[branch]=main -f source[path]=/
name: release

on:
  workflow_dispatch:

permissions:
  contents: write
  packages: read
  pages: write
  id-token: write

concurrency:
  group: release-pages
  cancel-in-progress: false

env:
  BUILDER: ghcr.io/sirredbeard/copilot-desktop-gtk-builder:latest
  APP_ID: com.github.sirredbeard.copilot-desktop-gtk

jobs:
  # Rebuilds the out-of-tree WebKitGTK drag-and-drop overlay (issue #2),
  # built from upstream WebKit main with our fork's fix cherry-picked on
  # top, only if upstream main or the fork branch moved since the last
  # cached build; otherwise this resolves in seconds via cache hit.
  # One call per arch: each arch's overlay builds on a self-hosted VM of
  # that arch, under its own cache key.
  webkit-dnd-x86:
    uses: ./.github/workflows/webkit-dnd-rebuild.yml
    secrets: inherit

  webkit-dnd-arm:
    uses: ./.github/workflows/webkit-dnd-rebuild.yml
    with:
      arch: aarch64
      vm_name: azure-webkit-dnd-arm-d16
      runner_label: webkit-dnd-arm
      cache_key_prefix: webkit-dnd-aarch64
    secrets: inherit

  build:
    needs: [webkit-dnd-x86, webkit-dnd-arm]
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
            gh_arch: amd64
          - arch: aarch64
            runner: ubuntu-24.04-arm
            gh_arch: arm64
    runs-on: ${{ matrix.runner }}
    container:
      image: ghcr.io/sirredbeard/copilot-desktop-gtk-builder:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: --user root --privileged
    outputs:
      version: ${{ steps.ver.outputs.version }}
      tag: ${{ steps.ver.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install gh CLI
        env:
          GH_ARCH: ${{ matrix.gh_arch }}
        run: |
          set -euo pipefail
          if command -v gh >/dev/null 2>&1; then
            gh --version
            exit 0
          fi
          ver="$(curl -fsSL https://api.github.com/repos/cli/cli/releases/latest | python3 -c 'import json,sys; print(json.load(sys.stdin)["tag_name"])')"
          curl -fsSL "https://github.com/cli/cli/releases/download/${ver}/gh_${ver#v}_linux_${GH_ARCH}.tar.gz" | tar -xz -C /tmp
          install -m755 "/tmp/gh_${ver#v}_linux_${GH_ARCH}/bin/gh" /usr/local/bin/gh
          gh --version

      - name: Next version
        id: ver
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          V="$(./scripts/next-version.sh)"
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "tag=v$V" >> "$GITHUB_OUTPUT"
          echo "next release: v$V"
          if gh release view "v$V" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "error: release v$V already exists" >&2
            exit 1
          fi

      - name: Restore WebKit DND overlay artifact
        uses: actions/cache/restore@v4
        with:
          path: dist/webkit-dnd-overlay
          key: ${{ matrix.arch == 'x86_64' && needs.webkit-dnd-x86.outputs.overlay_cache_key || needs.webkit-dnd-arm.outputs.overlay_cache_key }}
          fail-on-cache-miss: true

      - name: Stamp version into sources
        run: ./scripts/stamp-version.sh "${{ steps.ver.outputs.version }}"

      - name: NuGet package cache
        uses: actions/cache@v4
        with:
          path: /root/.nuget/packages
          key: nuget-${{ matrix.arch }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            nuget-${{ matrix.arch }}-

      - name: Restore Flatpak ostree repo cache
        uses: actions/cache@v4
        with:
          path: dist/flatpak-repo
          key: flatpak-ostree-${{ matrix.arch }}-${{ github.run_id }}
          restore-keys: |
            flatpak-ostree-${{ matrix.arch }}-

      - name: Build AOT + Flatpak
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          V="${{ steps.ver.outputs.version }}"
          export COPILOT_VERSION="$V"
          export FLATPAK_BRANCH=stable
          if [[ -z "${GPG_PRIVATE_KEY:-}" ]]; then
            echo "error: GPG_PRIVATE_KEY secret is required to sign the Pages Flatpak repo" >&2
            exit 1
          fi
          ./scripts/stamp-version.sh "$V"
          ./scripts/build-app.sh Release
          ./scripts/build-icons.sh
          ./scripts/test-smoke.sh
          ./scripts/build-flatpak.sh "$V"
          ./scripts/verify-flatpak-version.sh "$V" \
            "dist/flatpak/${{ env.APP_ID }}-${V}.flatpak"
          find dist/publish dist/flatpak dist/flatpak-repo -maxdepth 2 -type f -printf '%s %p\n' | sort -n | tail -40

      # Pages staging happens in the publish job, which has both arches.
      # Upload everything it needs: binary, bundle, the signed ostree
      # repo, the mirrored AppStream media, and the exported public key.
      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ steps.ver.outputs.version }}-${{ matrix.arch }}
          path: |
            dist/publish/copilot-desktop-gtk
            dist/flatpak/${{ env.APP_ID }}-${{ steps.ver.outputs.version }}.flatpak
            dist/flatpak-repo
            dist/flatpak-media
            dist/flatpak-repo-public.asc
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    outputs:
      version: ${{ needs.build.outputs.version }}
      tag: ${{ needs.build.outputs.tag }}
      page_url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: release-${{ needs.build.outputs.version }}-*
          path: artifacts

      - name: Layout artifacts
        id: files
        run: |
          set -euo pipefail
          V="${{ needs.build.outputs.version }}"
          TAG="${{ needs.build.outputs.tag }}"
          APP_ID="${{ env.APP_ID }}"
          X64="artifacts/release-${V}-x86_64"
          ARM="artifacts/release-${V}-aarch64"
          ls -la artifacts || true
          ls -la "$X64" "$ARM" 2>/dev/null || true
          # upload-artifact strips the common dist/ prefix, so each arch
          # dir holds publish/, flatpak/, flatpak-repo/, flatpak-media/.
          BIN_X64="${X64}/publish/copilot-desktop-gtk"
          BIN_ARM="${ARM}/publish/copilot-desktop-gtk"
          BUNDLE_X64="${X64}/flatpak/${APP_ID}-${V}.flatpak"
          BUNDLE_ARM="${ARM}/flatpak/${APP_ID}-${V}.flatpak"
          REPO_X64="${X64}/flatpak-repo"
          REPO_ARM="${ARM}/flatpak-repo"
          for f in "$BIN_X64" "$BIN_ARM" "$BUNDLE_X64" "$BUNDLE_ARM"; do
            if [[ ! -f "$f" ]]; then
              echo "missing artifact file: $f" >&2
              find artifacts -maxdepth 4 \( -type f -o -type d \) -print | sed -n '1,120p' || true
              exit 1
            fi
          done
          for d in "$REPO_X64" "$REPO_ARM"; do
            if [[ ! -f "$d/config" ]]; then
              echo "missing ostree repo: $d" >&2
              exit 1
            fi
          done
          # Release assets get arch suffixes: the two binaries and the
          # two bundles have the same base names per arch and would
          # collide on one Release without them.
          mkdir -p release-assets
          cp "$BIN_X64" "release-assets/copilot-desktop-gtk-x86_64"
          cp "$BIN_ARM" "release-assets/copilot-desktop-gtk-aarch64"
          cp "$BUNDLE_X64" "release-assets/${APP_ID}-${V}-x86_64.flatpak"
          cp "$BUNDLE_ARM" "release-assets/${APP_ID}-${V}-aarch64.flatpak"
          chmod +x release-assets/copilot-desktop-gtk-x86_64 release-assets/copilot-desktop-gtk-aarch64
          # stage-flatpak-pages.sh reads mirrored media and the exported
          # public key from dist/ under the repo root. Both are
          # arch-independent; take the x86_64 copies.
          mkdir -p dist
          if [[ -d "${X64}/flatpak-media" ]]; then
            cp -a "${X64}/flatpak-media" dist/flatpak-media
          fi
          if [[ -f "${X64}/flatpak-repo-public.asc" ]]; then
            cp "${X64}/flatpak-repo-public.asc" dist/flatpak-repo-public.asc
          fi
          {
            echo "bin_x64=release-assets/copilot-desktop-gtk-x86_64"
            echo "bin_arm=release-assets/copilot-desktop-gtk-aarch64"
            echo "bundle_x64=release-assets/${APP_ID}-${V}-x86_64.flatpak"
            echo "bundle_arm=release-assets/${APP_ID}-${V}-aarch64.flatpak"
            echo "repo_x64=${REPO_X64}"
            echo "repo_arm=${REPO_ARM}"
            echo "version=$V"
            echo "tag=$TAG"
          } >> "$GITHUB_OUTPUT"

      - name: Stage GitHub Pages site
        env:
          PAGES_OWNER: ${{ github.repository_owner }}
          PAGES_REPO: ${{ github.event.repository.name }}
          FLATPAK_APP_ID: ${{ env.APP_ID }}
          FLATPAK_APP_TITLE: Copilot
          FLATPAK_BRANCH: stable
        run: |
          set -euo pipefail
          APP_ID="${{ env.APP_ID }}"
          REPO_NAME="${{ github.event.repository.name }}"
          SITE="dist/pages-site"
          # x86_64 repo at repo/ - the URL existing installs already use.
          ./scripts/stage-flatpak-pages.sh "${{ steps.files.outputs.repo_x64 }}" "$SITE"
          test -f "$SITE/.nojekyll"
          test -f "$SITE/index.html"
          test -f "$SITE/repo/config"
          test -f "$SITE/${APP_ID}.flatpakref"
          test -f "$SITE/${REPO_NAME}.flatpakrepo"
          # aarch64 repo at repo-aarch64/, staged into a scratch site
          # (the script wipes its target), then merged into the real one.
          FLATPAK_OSTREE_SUBDIR=repo-aarch64 \
          FLATPAKREF_FILE="${APP_ID}-aarch64.flatpakref" \
          FLATPAKREPO_FILE="${REPO_NAME}-aarch64.flatpakrepo" \
            ./scripts/stage-flatpak-pages.sh "${{ steps.files.outputs.repo_arm }}" "dist/pages-site-arm"
          cp -a "dist/pages-site-arm/repo-aarch64" "$SITE/"
          cp "dist/pages-site-arm/${APP_ID}-aarch64.flatpakref" "$SITE/"
          cp "dist/pages-site-arm/${REPO_NAME}-aarch64.flatpakrepo" "$SITE/"
          test -f "$SITE/repo-aarch64/config"
          test -f "$SITE/${APP_ID}-aarch64.flatpakref"

      - name: Configure Pages
        uses: actions/configure-pages@v5
        # enablement needs admin; site must already use Source: GitHub Actions
        # (one-time: Settings → Pages, or gh api POST .../pages).

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/pages-site

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${{ steps.files.outputs.tag }}"
          OWNER="${{ github.repository_owner }}"
          REPO="${{ github.event.repository.name }}"
          PAGES="https://${OWNER}.github.io/${REPO}/"
          APP_ID="${{ env.APP_ID }}"
          # Keep this short. The .flatpakref declares RuntimeRepo=flathub so
          # flatpak pulls org.gnome.Platform without a separate install step.
          notes="$(cat <<NOTES
          ## Install from GitHub

          x86_64:
          \`\`\`bash
          flatpak install --user --from ${PAGES}com.github.sirredbeard.copilot-desktop-gtk.flatpakref
          flatpak run com.github.sirredbeard.copilot-desktop-gtk
          \`\`\`

          aarch64:
          \`\`\`bash
          flatpak install --user --from ${PAGES}com.github.sirredbeard.copilot-desktop-gtk-aarch64.flatpakref
          flatpak run com.github.sirredbeard.copilot-desktop-gtk
          \`\`\`

          Both builds carry the patched WebKitGTK overlay, each compiled for its own arch, so external file drag-and-drop works the same on either.

          ## Artifacts on this release

          * \`.flatpak\` bundles - offline install, one per arch (\`-x86_64\`, \`-aarch64\`)
          * \`copilot-desktop-gtk-x86_64\` / \`copilot-desktop-gtk-aarch64\` - bare Native AOT binaries
          NOTES
          )"
          # strip leading spaces from heredoc for cleaner notes
          notes="$(printf '%s\n' "$notes" | sed 's/^          //')"
          gh release create "$TAG" \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "$TAG" \
            --notes "$notes" \
            "${{ steps.files.outputs.bin_x64 }}" \
            "${{ steps.files.outputs.bin_arm }}" \
            "${{ steps.files.outputs.bundle_x64 }}" \
            "${{ steps.files.outputs.bundle_arm }}"

      - name: Wait for Pages repo config
        env:
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
        run: |
          set -euo pipefail
          base="https://${OWNER}.github.io/${REPO}"
          echo "Polling $base/repo/config and $base/repo-aarch64/config"
          for i in $(seq 1 24); do
            ok=1
            for sub in repo repo-aarch64; do
              code="$(curl -sS -o "/tmp/ostree-config-${sub}" -w '%{http_code}' --location "$base/${sub}/config" || true)"
              echo "attempt $i (${sub}): HTTP $code"
              if [ "$code" != "200" ] || ! grep -q '\[core\]' "/tmp/ostree-config-${sub}"; then
                ok=0
              fi
            done
            if [ "$ok" = "1" ]; then
              echo "Pages Flatpak repos are live (x86_64 + aarch64)"
              curl -fsSL "${base}/" | head -8 || true
              exit 0
            fi
            sleep 10
          done
          echo "Timed out waiting for Pages to serve repo config" >&2
          exit 1

  # Fresh builder container per arch: install from that arch's live
  # Pages remote (no .flatpak bundle).
  verify-pages-install:
    needs: publish
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
            ostree_subdir: repo
            flatpakref_file: com.github.sirredbeard.copilot-desktop-gtk.flatpakref
            flatpakrepo_file: copilot-desktop-gtk.flatpakrepo
          - arch: aarch64
            runner: ubuntu-24.04-arm
            ostree_subdir: repo-aarch64
            flatpakref_file: com.github.sirredbeard.copilot-desktop-gtk-aarch64.flatpakref
            flatpakrepo_file: copilot-desktop-gtk-aarch64.flatpakrepo
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull fresh builder image
        run: |
          set -euo pipefail
          docker pull "${{ env.BUILDER }}"

      - name: Install app from Pages Flatpak repo
        env:
          VERSION: ${{ needs.publish.outputs.version }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
          APP_ID: ${{ env.APP_ID }}
        run: |
          set -euo pipefail
          PAGES="https://${OWNER}.github.io/${REPO}/"
          docker run --rm --privileged \
            -e PAGES_OWNER="$OWNER" \
            -e PAGES_REPO="$REPO" \
            -e FLATPAK_APP_ID="$APP_ID" \
            -e FLATPAK_REMOTE_NAME="$REPO" \
            -e FLATPAK_BRANCH=stable \
            -e FLATPAK_OSTREE_SUBDIR="${{ matrix.ostree_subdir }}" \
            -e FLATPAKREF_FILE="${{ matrix.flatpakref_file }}" \
            -e FLATPAKREPO_FILE="${{ matrix.flatpakrepo_file }}" \
            -v "$PWD:/src:ro" \
            -w /src \
            "${{ env.BUILDER }}" \
            ./scripts/verify-flatpak-repo-install.sh "$VERSION" "$PAGES"
