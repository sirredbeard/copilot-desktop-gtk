# Manual release only: auto-bump patch version, build AOT + Flatpak in the
# builder image, create vX.Y.Z tag, publish GitHub Release assets.
name: release

on:
  workflow_dispatch:

permissions:
  contents: write
  packages: read

env:
  BUILDER: ghcr.io/sirredbeard/copilot-desktop-gtk-builder:latest

jobs:
  release:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/sirredbeard/copilot-desktop-gtk-builder:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: --user root --privileged
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install gh CLI
        run: |
          set -euo pipefail
          if command -v gh >/dev/null 2>&1; then
            gh --version
            exit 0
          fi
          ver="$(curl -fsSL https://api.github.com/repos/cli/cli/releases/latest | python3 -c 'import json,sys; print(json.load(sys.stdin)["tag_name"])')"
          curl -fsSL "https://github.com/cli/cli/releases/download/${ver}/gh_${ver#v}_linux_amd64.tar.gz" | tar -xz -C /tmp
          install -m755 "/tmp/gh_${ver#v}_linux_amd64/bin/gh" /usr/local/bin/gh
          gh --version

      - name: Next version
        id: ver
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          V="$(./scripts/next-version.sh)"
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "tag=v$V" >> "$GITHUB_OUTPUT"
          echo "next release: v$V"
          # Refuse to clobber an existing release tag.
          if gh release view "v$V" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "error: release v$V already exists" >&2
            exit 1
          fi

      - name: Stamp version into sources
        run: ./scripts/stamp-version.sh "${{ steps.ver.outputs.version }}"

      - name: NuGet package cache
        uses: actions/cache@v4
        with:
          path: /root/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Build AOT + Flatpak
        run: |
          set -euo pipefail
          V="${{ steps.ver.outputs.version }}"
          export COPILOT_VERSION="$V"
          # Single source of truth for this run: stamp before any packaging.
          ./scripts/stamp-version.sh "$V"
          ./scripts/build-app.sh Release
          ./scripts/build-icons.sh
          ./scripts/test-smoke.sh
          ./scripts/build-flatpak.sh "$V"
          ./scripts/verify-flatpak-version.sh "$V" \
            "dist/flatpak/com.github.sirredbeard.copilot-desktop-gtk-${V}.flatpak"
          ls -lah dist/publish/ dist/flatpak/

      - name: Create tag and GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cd "${GITHUB_WORKSPACE}"
          V="${{ steps.ver.outputs.version }}"
          TAG="${{ steps.ver.outputs.tag }}"
          test -f dist/publish/copilot-desktop-gtk
          test -f "dist/flatpak/com.github.sirredbeard.copilot-desktop-gtk-${V}.flatpak"
          # Tag + release via API so container job does not need a writable local git.
          gh release create "$TAG" \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "$TAG" \
            --generate-notes \
            dist/publish/copilot-desktop-gtk \
            "dist/flatpak/com.github.sirredbeard.copilot-desktop-gtk-${V}.flatpak"
