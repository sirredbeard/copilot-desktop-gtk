# Manual release: auto-bump patch, build AOT + Flatpak in the builder image,
# publish GitHub Release assets, deploy the ostree repo to GitHub Pages so
# flatpakref installs get updates via `flatpak update`.
name: release

on:
  workflow_dispatch:

permissions:
  contents: write
  packages: read
  pages: write
  id-token: write

concurrency:
  group: release-pages
  cancel-in-progress: false

env:
  BUILDER: ghcr.io/sirredbeard/copilot-desktop-gtk-builder:latest
  APP_ID: com.github.sirredbeard.copilot-desktop-gtk

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/sirredbeard/copilot-desktop-gtk-builder:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: --user root --privileged
    outputs:
      version: ${{ steps.ver.outputs.version }}
      tag: ${{ steps.ver.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install gh CLI
        run: |
          set -euo pipefail
          if command -v gh >/dev/null 2>&1; then
            gh --version
            exit 0
          fi
          ver="$(curl -fsSL https://api.github.com/repos/cli/cli/releases/latest | python3 -c 'import json,sys; print(json.load(sys.stdin)["tag_name"])')"
          curl -fsSL "https://github.com/cli/cli/releases/download/${ver}/gh_${ver#v}_linux_amd64.tar.gz" | tar -xz -C /tmp
          install -m755 "/tmp/gh_${ver#v}_linux_amd64/bin/gh" /usr/local/bin/gh
          gh --version

      - name: Next version
        id: ver
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          V="$(./scripts/next-version.sh)"
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "tag=v$V" >> "$GITHUB_OUTPUT"
          echo "next release: v$V"
          if gh release view "v$V" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "error: release v$V already exists" >&2
            exit 1
          fi

      - name: Stamp version into sources
        run: ./scripts/stamp-version.sh "${{ steps.ver.outputs.version }}"

      - name: NuGet package cache
        uses: actions/cache@v4
        with:
          path: /root/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Restore Flatpak ostree repo cache
        uses: actions/cache@v4
        with:
          path: dist/flatpak-repo
          key: flatpak-ostree-${{ github.run_id }}
          restore-keys: |
            flatpak-ostree-

      - name: Build AOT + Flatpak
        run: |
          set -euo pipefail
          V="${{ steps.ver.outputs.version }}"
          export COPILOT_VERSION="$V"
          export FLATPAK_BRANCH=stable
          ./scripts/stamp-version.sh "$V"
          ./scripts/build-app.sh Release
          ./scripts/build-icons.sh
          ./scripts/test-smoke.sh
          ./scripts/build-flatpak.sh "$V"
          ./scripts/verify-flatpak-version.sh "$V" \
            "dist/flatpak/${{ env.APP_ID }}-${V}.flatpak"
          find dist/publish dist/flatpak dist/flatpak-repo -maxdepth 2 -type f -printf '%s %p\n' | sort -n | tail -40

      - name: Stage GitHub Pages site
        env:
          PAGES_OWNER: ${{ github.repository_owner }}
          PAGES_REPO: ${{ github.event.repository.name }}
          FLATPAK_APP_ID: ${{ env.APP_ID }}
          FLATPAK_APP_TITLE: Copilot
          FLATPAK_BRANCH: stable
        run: |
          set -euo pipefail
          ./scripts/stage-flatpak-pages.sh dist/flatpak-repo dist/pages-site
          test -f dist/pages-site/.nojekyll
          test -f dist/pages-site/index.html
          test -f dist/pages-site/repo/config
          test -f "dist/pages-site/${{ env.APP_ID }}.flatpakref"
          test -f "dist/pages-site/${{ github.event.repository.name }}.flatpakrepo"

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ steps.ver.outputs.version }}
          path: |
            dist/publish/copilot-desktop-gtk
            dist/flatpak/${{ env.APP_ID }}-${{ steps.ver.outputs.version }}.flatpak
            dist/pages-site
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-${{ needs.build.outputs.version }}
          path: artifacts

      - name: Layout artifacts
        id: files
        run: |
          set -euo pipefail
          V="${{ needs.build.outputs.version }}"
          TAG="${{ needs.build.outputs.tag }}"
          find artifacts -type f | head -50
          BIN="$(find artifacts -type f -name copilot-desktop-gtk | head -1)"
          BUNDLE="$(find artifacts -type f -name "com.github.sirredbeard.copilot-desktop-gtk-${V}.flatpak" | head -1)"
          SITE="$(find artifacts -type d -name pages-site | head -1)"
          test -n "$BIN" && test -x "$BIN" || chmod +x "$BIN"
          test -f "$BUNDLE"
          test -d "$SITE" && test -f "$SITE/repo/config"
          {
            echo "bin=$BIN"
            echo "bundle=$BUNDLE"
            echo "site=$SITE"
            echo "version=$V"
            echo "tag=$TAG"
          } >> "$GITHUB_OUTPUT"

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ steps.files.outputs.site }}

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ steps.files.outputs.tag }}"
          BIN="${{ steps.files.outputs.bin }}"
          BUNDLE="${{ steps.files.outputs.bundle }}"
          OWNER="${{ github.repository_owner }}"
          REPO="${{ github.event.repository.name }}"
          PAGES="https://${OWNER}.github.io/${REPO}/"
          notes="$(cat <<NOTES
          ## Install from GitHub Pages (recommended)

          Adds the project Flatpak remote so \`flatpak update\` gets later releases:

          \`\`\`bash
          flatpak install --user flathub org.gnome.Platform//50
          flatpak install --user --from ${PAGES}com.github.sirredbeard.copilot-desktop-gtk.flatpakref
          flatpak run com.github.sirredbeard.copilot-desktop-gtk
          \`\`\`

          Repo landing page: ${PAGES}

          ## Single-file bundle

          Offline/sideload \`.flatpak\` attached below (does not register the Pages remote for updates).
          NOTES
          )"
          # strip leading spaces from heredoc for cleaner notes
          notes="$(printf '%s\n' "$notes" | sed 's/^          //')"
          gh release create "$TAG" \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "$TAG" \
            --notes "$notes" \
            "$BIN" \
            "$BUNDLE"

      - name: Wait for Pages repo config
        env:
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
        run: |
          set -euo pipefail
          url="https://${OWNER}.github.io/${REPO}/repo/config"
          echo "Polling $url"
          for _ in $(seq 1 24); do
            if curl --fail --silent --show-error --location "$url" >/dev/null; then
              echo "Pages Flatpak repo is live"
              curl -fsSL "https://${OWNER}.github.io/${REPO}/" | head -5
              exit 0
            fi
            sleep 10
          done
          echo "Timed out waiting for Pages to serve repo/config" >&2
          exit 1
